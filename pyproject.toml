[project]
name = "claim-validator"
version = "0.1.0"
description = "Given a reference document and an external tool's or person's claims, independently judges whether each is supported and reports what's missing"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
    "openpyxl>=3.1.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "pypdf>=4.0.0",
    "pdfplumber>=0.10.0",
    "python-docx>=0.8.11",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "python-multipart>=0.0.6",
    "pyjwt[crypto]>=2.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["phases", "db", "claimvalidator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".venv"]
